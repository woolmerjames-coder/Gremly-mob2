name = "gremly-inngest-jobs"
main = "inngest-index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# These will be overwritten by secrets
CORTEX_WORKER_URL = "https://gentle-thunder-5854.woolmerjames.workers.dev"

# Context pipeline (lifemaps-context-fixes-9.30):
#   off     nothing new runs
#   shadow  the fact ledger fills; DCO v4 and weekly results are written beside the live ones
#   on      the new outputs are live: DCO v4, and the weekly synthesis owns the Life Map,
#           the profile text and the words on each World
# Models can be overridden per job, e.g. CONTEXT_MODEL_DAILY = "google:gemini-3.8-flash".
CONTEXT_PIPELINE = "on"
# Only used when CONTEXT_PIPELINE is "shadow": people who get the new pipeline live
# (comma-separated user ids). James, Tina and Dave were the accounts checked first;
# since 1 Oct 2026 the pipeline is on for everyone, new people included.
CONTEXT_LIVE_USERS = "05a3c53d-b242-4b5f-a0db-83004c8e3892,c64ec85f-735c-4d5c-859a-1ac6630aebb3,c7674834-114b-4f6d-ac57-4d18aec8393b"

# Add secrets via CLI:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_SERVICE_KEY
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put INNGEST_SIGNING_KEY
# npx wrangler secret put INNGEST_EVENT_KEY

# Service binding to Cortex worker — avoids Worker-to-Worker 404 (CF error 1042)
# when calling another workers.dev Worker on the same account via HTTP.
[[services]]
binding = "CORTEX"
service = "gentle-thunder-5854"

[observability]
enabled = true

[limits]
cpu_ms = 300000


# Chat's context cache (shared with the cortex worker): the context pipeline
# drops a person's cached profile, Life Map, DCO and anchors after it changes
# them, so chat reads the new version straight away.
[[kv_namespaces]]
binding = "CONTEXT_CACHE"
id = "d97644351d99456da19eb66f52d0189e"
