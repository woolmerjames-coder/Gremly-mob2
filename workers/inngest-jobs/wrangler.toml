name = "gremly-inngest-jobs"
main = "inngest-index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# These will be overwritten by secrets
CORTEX_WORKER_URL = "https://gentle-thunder-5854.woolmerjames.workers.dev"

# Notifications report problems and cron check ins here. A DSN only lets a
# client send events to Sentry (the app ships one in App.tsx), so it can live
# in this file; this is the "workers" key on the react-native project.
SENTRY_DSN = "https://2d2ac70795b0667b2ff47227eb9cac32@o4511237634260992.ingest.us.sentry.io/4511237636292608"
SENTRY_ENVIRONMENT = "production"

# Notifications rollout: "off" sends nothing, "testers" sends only to tester
# accounts (for TestFlight checks), "on" sends to everyone.
NOTIFICATIONS_MODE = "on"

# Context pipeline (lifemaps-context-fixes-9.30):
#   off     nothing new runs
#   shadow  the fact ledger fills; DCO v4 and weekly results are written beside the live ones
#   on      the new outputs are live: DCO v4, and the weekly synthesis owns the Life Map,
#           the profile text and the words on each World
# Models can be overridden per job, e.g. CONTEXT_MODEL_DAILY = "google:gemini-3.8-flash".
CONTEXT_PIPELINE = "on"
# How hard the daily picture thinks (CONTEXT_EFFORT_DAILY: low, medium or
# high; low when unset). Medium made no difference in stage 4d: what falls on
# the day led about as often at either effort, on the life replay and on a
# real morning in shadow, at 40% more cost. Left unset until a replay shows a
# setting that does.
# Only used when CONTEXT_PIPELINE is "shadow": people who get the new pipeline live
# (comma-separated user ids). James, Tina and Dave were the accounts checked first;
# since 1 Oct 2026 the pipeline is on for everyone, new people included.
CONTEXT_LIVE_USERS = "05a3c53d-b242-4b5f-a0db-83004c8e3892,c64ec85f-735c-4d5c-859a-1ac6630aebb3,c7674834-114b-4f6d-ac57-4d18aec8393b"
# The stop switch for the old Worlds fields (workers/shared/worldsFields.js,
# section A of docs/worlds/FOR_THE_PIPELINE.md): "keep" writes them as before;
# "stop", once the Worlds build says the old screens are gone, stops the weekly
# pass, the Sunday classifier and filing from writing them.
WORLDS_OLD_FIELDS = "keep"
# Gremly's questions about Chapters (workers/shared/questionRules.js,
# context/chapterQuestions.js): suggesting one, asking whether one past its
# dates is over, and the welcome back. Built and replayed in data fabric stage
# 4c and "off" until the Worlds build can act on an answer; "on" switches them on.
CHAPTER_QUESTIONS = "off"
# The weekly summary from the weekly pass (summaryFromPass.ts, data fabric
# stage 5): "off" sends the old summary only; "beside" sends the old one and
# writes the new one beside it in shadow_runs for James to read; "on" sends the
# new one only, with no 21 day fetch, analyst or Life Map rebuild.
SUMMARY_FROM_PASS = "beside"
# What is left of the Sunday classifier in the weekly pipe (week/index.js):
# "on" runs it after the weekly pass, as since stage 4b; "off" takes it out,
# once Chapter suggestions come from the Chapter questions (CHAPTER_QUESTIONS
# on). The parity replay (scripts/worlds-parity) is what the call rests on.
WEEKLY_CLASSIFIER = "on"
# The weekly review's read from the weekly pass (week/read.js readFromPass):
# "on" gives the read the dated facts ahead and Gremly's note on the week, and
# Gremly's notes on Worlds and Chapters in place of priorities. Left "off" until
# the weekly review's build agrees it, the week replay is run with it on, and
# the week note holds no private matter (the weekly replay's judge still finds
# one in 2 of 3 weeks that turn on health).
WEEK_READ_FROM_PASS = "off"

# Add secrets via CLI:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_SERVICE_KEY
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put INNGEST_SIGNING_KEY
# npx wrangler secret put INNGEST_EVENT_KEY

# Service binding to Cortex worker — avoids Worker-to-Worker 404 (CF error 1042)
# when calling another workers.dev Worker on the same account via HTTP.
[[services]]
binding = "CORTEX"
service = "gentle-thunder-5854"

[observability]
enabled = true

[limits]
cpu_ms = 300000


# Chat's context cache (shared with the cortex worker): the context pipeline
# drops a person's cached profile, Life Map, DCO and anchors after it changes
# them, so chat reads the new version straight away.
[[kv_namespaces]]
binding = "CONTEXT_CACHE"
id = "d97644351d99456da19eb66f52d0189e"

# Notifications: the worker's own cron (notifications/cron.js). Every minute it
# plans reminders and days with a few small reads; at minute 7 of each hour it
# reads Expo receipts, runs the watchdog and checks in with Sentry.
[triggers]
crons = ["* * * * *"]
