name = "gentle-thunder-5854"
main = "cortex-index.js"
compatibility_date = "2024-01-01"

[vars]
INNGEST_WORKER_URL = "https://gremly-inngest-jobs.woolmerjames.workers.dev"
# Mind Drop one call classifier (classify-v3). Chosen by the model audit in
# docs/2026-09-29-minddrop-model-audit.md: Gemini 3.8 Flash, GPT-6 Luna backup.
# Questions are worded by Claude Sonnet when ANTHROPIC_API_KEY is set.
# CLASSIFY_V3_ENABLED = "false" sends every app build back to the v2 chain.
CLASSIFY_V3_ENABLED = "true"
CLASSIFY_PROVIDER = "gemini"
CLASSIFY_MODEL = "gemini-3.8-flash"
CLASSIFY_THINKING_LEVEL = "low"
CLASSIFY_FALLBACK_PROVIDER = "openai"
CLASSIFY_FALLBACK_MODEL = "gpt-6-luna"

# Every other model the Worker calls is chosen in models.js. Nothing is set here
# yet, so the defaults apply (what production ran before models.js existed).
# To move a model, set the var and deploy; the corpus gate comes first.
#   CHAT_MODEL                the Gemini model behind every chat surface (default gemini-3-flash-preview)
#   HELPER_MODEL              the small model behind triage, loading message, summaries,
#                             extraction, habit pre parse and so on (default gpt-4.1-mini)
#   MODEL_<JOB>               one helper job on its own, for example MODEL_TRIAGE_MODE or
#                             MODEL_CHAT_EXTRACTION; the full list is HELPER_JOB_VARS in models.js
#   APP_HELPER_MODEL          the generic non streaming path app builds call (default gpt-4o-mini)
#   LEGACY_OPENAI_CHAT_MODEL  non streaming OpenAI fallback for Space, World, Chapter (default gpt-4.1)
#   WEEKLY_SUMMARY_MODEL      weekly summary (default claude-sonnet-4-5-20250929)
#   HELPER_FALLBACK_MODEL     retry a failed helper call once on this model (default none)
#   TRIAGE_ONE_CALL           on: one triage call instead of two (default off)
#   CHAT_EXTRACTION_V2        on: evidence rule, 2,000 cap, JSON mode, skipped on
#                             chit chat, playful, app help, venting, emotional,
#                             celebration turns (default off)
#   SEARCH_REQUIRED_FORCES    off: a required search attaches the tool and lets the
#                             reply model decide (default on, forces a search)
#
# The split proposed by docs/2026-09-29-chat-helper-model-audit.md, to be set
# together after the chat corpus gate (all still off):
#   CHAT_MODEL = "gemini-3.8-flash"
#   HELPER_MODEL = "gpt-6-luna"
#   HELPER_FALLBACK_MODEL = "gemini-3.8-flash"
#   TRIAGE_ONE_CALL = "on"
#   CHAT_EXTRACTION_V2 = "on"
#   SEARCH_REQUIRED_FORCES = "off"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via `wrangler secret put <NAME>`):
# - OPENAI_API_KEY
# - GEMINI_API_KEY (or GOOGLE_API_KEY): Mind Drop classifier
# - ANTHROPIC_API_KEY: clarifying question wording
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY

[[kv_namespaces]]
binding = "CONTEXT_CACHE"
id = "d97644351d99456da19eb66f52d0189e"
