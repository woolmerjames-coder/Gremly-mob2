name = "gentle-thunder-5854"
main = "cortex-index.js"
compatibility_date = "2024-01-01"
# AsyncLocalStorage (node:async_hooks) for usage logging: every model call is
# tied to the request that made it (../shared/aiUsage.js).
compatibility_flags = ["nodejs_als"]

# Calls to inngest-jobs go through this binding: Cloudflare refuses a fetch to
# another workers.dev Worker on the same account (error 1042).
[[services]]
binding = "INNGEST"
service = "gremly-inngest-jobs"

[vars]
INNGEST_WORKER_URL = "https://gremly-inngest-jobs.woolmerjames.workers.dev"
# Mind Drop one call classifier (classify-v3). Chosen by the model audit in
# docs/2026-09-29-minddrop-model-audit.md: Gemini 3.8 Flash, GPT-6 Luna backup.
# Questions are worded by Claude Sonnet when ANTHROPIC_API_KEY is set.
# CLASSIFY_V3_ENABLED = "false" sends every app build back to the v2 chain.
CLASSIFY_V3_ENABLED = "true"
CLASSIFY_PROVIDER = "gemini"
CLASSIFY_MODEL = "gemini-3.8-flash"
CLASSIFY_THINKING_LEVEL = "low"
CLASSIFY_FALLBACK_PROVIDER = "openai"
CLASSIFY_FALLBACK_MODEL = "gpt-6-luna"
# Mind Drop: after a drop is classified, ask whether it is about something the user
# already has (a repeat, a change, a done todo, a habit they did). It runs on the chat
# matcher's model (MODEL_ENTITY_MATCH). On for James's hands-on test (30 Sep 2026),
# after the replay in docs/minddrop-relate.md. "false" turns it off with no app build;
# the app then files drops as before.
MINDDROP_RELATE_ENABLED = "true"

# Every other model the Worker calls is chosen in models.js; a var here overrides
# its default. To move a model, set the var and deploy; the corpus gate comes first.
#   CHAT_MODEL                the Gemini model behind every chat surface (default gemini-3-flash-preview)
#   CHAT_MODEL_ASK            Ask Gremly's writer on its own (default CHAT_MODEL); an OpenAI
#                             model goes through openaiChat.js
#   CHAT_EFFORT_ASK           how much an OpenAI writer thinks before it writes (default none)
#   HELPER_MODEL              the small model behind triage, loading message, summaries,
#                             extraction, habit pre parse and so on (default gpt-4.1-mini)
#   MODEL_<JOB>               one helper job on its own, for example MODEL_TRIAGE_MODE or
#                             MODEL_CHAT_EXTRACTION; the full list is HELPER_JOB_VARS in models.js
#   APP_HELPER_MODEL          the generic non streaming path app builds call (default gpt-4o-mini)
#   LEGACY_OPENAI_CHAT_MODEL  non streaming OpenAI fallback for Space, World, Chapter (default gpt-4.1)
#   WEEKLY_SUMMARY_MODEL      weekly summary (default claude-sonnet-4-5-20250929)
#   HELPER_FALLBACK_MODEL     retry a failed helper call once on this model (default none)
#   AGENT_MODEL               the agent's model on every surface (agent/run.js; default gemini-3.8-flash)
#   AGENT_FALLBACK_MODEL      tried once when the agent's first step fails (default gpt-6-luna)
#   AGENT_MODEL_BRIEF, AGENT_MODEL_CHAT  one surface on its own
#   AGENT_CHAT                on, or user ids: Ask Gremly's lookups and changes on the agent
#                             (agent/chat.js), for app builds that send agentCard
#   AGENT_BRIEF               on: today's thread on the agent (agent/brief.js, type brief-turn);
#                             off: the day turn answers brief-turn, as before. Only app builds
#                             from step 7 on call brief-turn; older builds keep calling day-turn
#   TRIAGE_ONE_CALL           on: one triage call instead of two (default off); its model is
#                             MODEL_TRIAGE, and in Ask Gremly it also records the lane
#   CHAT_EXTRACTION_V2        on: evidence rule, 2,000 cap, JSON mode, skipped on
#                             chit chat, playful, app help, venting, emotional,
#                             celebration turns (default off)
#   SEARCH_REQUIRED_FORCES    off: a required search attaches the tool and lets the
#                             reply model decide (default on, forces a search)
#   ENTITY_CARDS              on: match a mention to one of the user's items and show
#                             its card with a proposed change to confirm (default off)
#   CHAT_PILL_SPLIT           on: the Save items pill is its own focused call (new and
#                             changed only) and the chat title a separate small call,
#                             both after the reply (default off, the single four-job call)

# The split from docs/2026-09-29-chat-helper-model-audit.md, live since 29 Sep 2026.
# James judges the chat tone in the app rather than by a replay (his call).
# The chat model is back on the model it ran on before 29 Sep: the live test
# found the tone had changed, and that change was never put through the corpus
# gate. Helpers that do not shape the reply stay on Luna.
# Triage (agent plan step 6, replay of 2 Oct 2026 on the audit's 500 locked
# turns and 293 lane turns): one call on Luna with no thinking, 75% of turns
# with mode, length and search all right against 68% for the two calls on
# gpt-4.1-mini, 95% of lanes right, 0.94s typical. It changes the reply's
# instructions on about half of messages, so James judges the tone in the app.
# To go back: TRIAGE_ONE_CALL = "off" (the two calls keep gpt-4.1-mini). A
# failed call is retried once on HELPER_FALLBACK_MODEL.
CHAT_MODEL = "gemini-3-flash-preview"
# Ask Gremly's writer on Luna with no thinking (agent plan step 9, writer test of
# 3 Oct 2026: 40 of James's turns through the live chat path, two blind judges).
# Luna with the new tone section scored 6.9 of 10 against 5.2 for the preview and
# was the better reply on 33 of 40 turns, at about 1.0s to the first word and
# 0.08 cents a reply against 0.9s and 0.45 cents. Gemini 3.7 and 3.8 Flash scored
# like Luna at eight times the cost. A writer that fails to start is tried once
# on CHAT_MODEL. To go back: remove this line.
CHAT_MODEL_ASK = "gpt-6-luna"
HELPER_MODEL = "gpt-6-luna"
HELPER_FALLBACK_MODEL = "gemini-3.8-flash"
MODEL_TRIAGE = "gpt-6-luna"
MODEL_TRIAGE_MODE = "gpt-4.1-mini"
MODEL_TRIAGE_SIGNALS = "gpt-4.1-mini"
# The line Ask Gremly shows while it works, on Luna since 4 Oct: on the chat
# replay's 18 messages its lines read truer to what was asked; it takes about
# 1s against 0.6s, and runs alongside the reply, so the reply comes no later
# (scripts/chat-replay/loading.sh). To go back: "gpt-4.1-mini".
MODEL_LOADING_MESSAGE = "gpt-6-luna"
TRIAGE_ONE_CALL = "on"
# The stop switch for the old Worlds fields (workers/shared/worldsFields.js):
# "keep" files into suggested rows and life contexts as before; "stop", once
# the Worlds build says the old screens are gone, stops filing from doing so.
# Filing itself runs on the pipeline's filing model (context/llm.js).
WORLDS_OLD_FIELDS = "keep"
# Today's thread on the agent (agent plan step 7), on Luna by James's choice:
# the day turn's replay suite (11 messages) passed 20 of 22 runs at 5.4s typical
# and about 0.06 cents a message, against 5 of 11 for today's day turn on Luna.
# Gemini 3.8 Flash was faster (2.9s) but about 1.35 cents a message, nearly three
# times the brief's budget. A first step that fails is tried once on Gemini; when
# the agent cannot finish, the day turn answers.
AGENT_BRIEF = "on"
AGENT_MODEL_BRIEF = "gpt-6-luna"
# Ask Gremly's lookups and changes on the agent (agent plan step 9), on Luna at
# low thinking. On for everyone from step 10, before the TestFlight build
# (James, 4 Oct); James's id alone turns it back to his account only. Only app
# builds that can draw the agent's card are sent to it.
AGENT_CHAT = "on"
AGENT_MODEL_CHAT = "gpt-6-luna"
AGENT_FALLBACK_MODEL = "gemini-3.8-flash"
CHAT_EXTRACTION_V2 = "on"
SEARCH_REQUIRED_FORCES = "off"
ENTITY_CARDS = "on"
CHAT_PILL_SPLIT = "on"
# The matcher reads the whole item list; on a 140 item list Gemini 3.8 Flash found the
# item every time where Luna missed one in two, at the same speed (scenario gate, 30 Sep 2026).
MODEL_ENTITY_MATCH = "gemini-3.8-flash"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via `wrangler secret put <NAME>`):
# - OPENAI_API_KEY
# - GEMINI_API_KEY (or GOOGLE_API_KEY): Mind Drop classifier
# - ANTHROPIC_API_KEY: clarifying question wording
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY

[[kv_namespaces]]
binding = "CONTEXT_CACHE"
id = "d97644351d99456da19eb66f52d0189e"
